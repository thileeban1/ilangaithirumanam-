name: Deploy Education LMS to Firebase Hosting

# Completely separate from the matrimony site's workflows: only triggers when
# files under lms/ change, only builds the lms/ app, and deploys to its own
# Firebase project — the matrimony website's build/deploy is untouched.
on:
  push:
    branches: [main, claude/education-lms-development-eejanf]
    paths:
      - "lms/**"
      - ".github/workflows/deploy-lms.yml"
  workflow_dispatch: {}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lms/package-lock.json
      - run: npm install
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.LMS_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.LMS_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.LMS_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.LMS_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.LMS_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.LMS_FIREBASE_APP_ID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_LMS_SERVICE_ACCOUNT }}"
          projectId: "${{ secrets.LMS_FIREBASE_PROJECT_ID }}"
          channelId: live
          entryPoint: lms
